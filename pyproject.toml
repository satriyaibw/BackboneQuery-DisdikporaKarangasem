[project]
name = "backbone-client-pull"
version = "1.0.0"
description = "Penarikan data Backbone API ke SQL Server / PostgreSQL / MySQL (Prefect serve)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prefect>=3.2",
    "aiohttp>=3.11",
    "sqlalchemy>=2.0",
    "pymssql>=2.3",
    "psycopg2-binary>=2.9",
    "pymysql>=1.2",
    "python-dotenv>=1.0",
    "croniter>=6.2.4",
    "pymysql>=1.2.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
