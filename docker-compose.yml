# Prefect Server self-hosted (opsional) untuk menampilkan Backbone Client Pull
# di Prefect UI. Ini TIDAK menjalankan penarikan data — penarikan tetap dijalankan
# oleh `uv run python main.py` di sisi host (lihat README §6).
#
#   docker compose up -d        # jalankan server + database di background
#   # UI: http://127.0.0.1:4200
#   # lalu di .env set: PREFECT_API_URL=http://127.0.0.1:4200/api
#   docker compose down         # hentikan (data metadata tetap tersimpan di volume)
#   docker compose down -v      # hentikan + hapus volume (reset metadata Prefect)

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prefect
      POSTGRES_PASSWORD: prefect
      POSTGRES_DB: prefect
    volumes:
      - prefect-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect -d prefect"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prefect-server:
    image: prefecthq/prefect:3-latest
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Metadata Prefect disimpan di PostgreSQL container `database`.
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://prefect:prefect@database:5432/prefect
      # Bind ke semua interface agar UI/API dapat diakses dari host.
      PREFECT_SERVER_API_HOST: 0.0.0.0
      # Untuk akses dari KOMPUTER LAIN di jaringan yang sama (bukan cuma dari
      # server ini sendiri): isi dengan IP/hostname server ini (lihat README §6.3
      # cara mengeceknya), lalu jalankan `docker compose up -d` lagi agar terbaca.
      # Tanpa ini, UI yang dibuka dari komputer lain akan gagal terhubung ke API
      # (browser diarahkan ke alamat yang cuma valid dari server sendiri).
      # PREFECT_SERVER_UI_API_URL: http://<IP-ATAU-HOSTNAME-SERVER>:4200/api
      # Retensi otomatis: Prefect Server TIDAK membersihkan flow run/log secara
      # default (hanya "events" yang divacuum bawaan). Aktifkan "flow_runs" agar
      # flow run + log-nya yang lebih lama dari retensi berikut dihapus otomatis
      # (berjalan tiap jam) — disamakan ~2 bulan dengan PULL_LOG_RETENTION_DAYS.
      PREFECT_SERVER_SERVICES_DB_VACUUM_ENABLED: "events,flow_runs"
      PREFECT_SERVER_SERVICES_DB_VACUUM_RETENTION_PERIOD: "5184000"  # 60 hari (detik)
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    restart: unless-stopped

volumes:
  prefect-db:
